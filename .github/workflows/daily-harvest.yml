# Daily deal harvest from Mailman — LIVE pipeline (cloud, not Tristan's PC).
#
# Flow: Gmail (dirk@, Mailman token) → mail table → ingest → Apify → POST Flow App
#
# Schedule: driven by Vercel Cron hitting the Flow App route
# web/app/api/cron/harvest, which calls workflow_dispatch. GitHub's own
# scheduler never fired reliably for this repo, so the native crons below are
# only a best-effort backup (odd minutes, since :00/:30 are the worst slots).
# See pipeline/GMAIL_SETUP.md §3.
#
# Ingest is idempotent (2-day lookback + ext_id / gmail_id upsert), so overlapping
# triggers are harmless; concurrency below serializes them.
#
# Secrets required (existing names — do not invent new ones):
#   GMAIL_CLIENT_SECRET_JSON — pipeline/credentials/client_secret.json
#   GMAIL_TOKEN_JSON         — pipeline/credentials/mailman_token.json (dirk@, gmail.modify)
#   FLOW_APP_URL             — https://web-tau-seven-77.vercel.app
#   PIPELINE_TOKEN           — preferred bearer for POST /api/import (harvest/mailman lane)
#   FLOW_IMPORT_TOKEN        — fallback; same value as Vercel. Do not POST /api/next/import.
#   APIFY_TOKEN              — BizBuySell listing enrich (skipped when mailman_only)
#
# First stage: python mailman.py --days 2 (label only; no broker email, no URL invention).
# Harve's 5:30 does not open Gmail — he reads mail.label=listing from this job's
# nm-deals-db-v2 artifact (and/or the same job finishes ingest_mail + export_snapshot
# --post /api/import). His weekday Grok Bot loop still exists until this cloud
# catcher is live; it must not depend on Tristan's Desktop DB.
#
# nm_deals.db: restore artifact nm-deals-db-v2, re-upload after the run (even if
# later steps fail or mailman_only). Never commit it. Never drop this artifact.

name: Daily harvest

on:
  # PRIMARY trigger is workflow_dispatch, called by Vercel Cron
  # (web/app/api/cron/harvest). GitHub's own scheduler is an unreliable backup.
  workflow_dispatch:
    inputs:
      mailman_only:
        description: "Stop after Mailman catcher (no ingest, Apify, or Flow POST). Use this to test GMAIL_* secrets."
        type: boolean
        default: false
  repository_dispatch:
    types: [harvest]
  schedule:
    # Backup only. Timezone-aware so 5:17 AM / 2:23 PM stay on America/Chicago
    # across DST. Odd minutes on purpose — :00/:30 are where GitHub drops schedules.
    - cron: "17 5 * * *"
      timezone: "America/Chicago"
    - cron: "23 14 * * *"
      timezone: "America/Chicago"

concurrency:
  group: daily-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Mailman self-test
        run: python mailman.py --self-test && python test_mailman.py

      - name: Restore previous SQLite db
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-harvest.yml
          # v2: fresh start after 2026-07-31 flush (old artifact had split SMB cards)
          name: nm-deals-db-v2
          path: pipeline
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Write Gmail OAuth credentials
        env:
          CLIENT: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "Missing GMAIL_CLIENT_SECRET_JSON or GMAIL_TOKEN_JSON secrets"
            echo "Paste client_secret.json and mailman_token.json (dirk@, gmail.modify)."
            echo "Agents cannot write GitHub secrets — Tristan must set them on the repo."
            exit 1
          fi
          printf '%s' "$CLIENT" > credentials/client_secret.json
          printf '%s' "$TOKEN" > credentials/mailman_token.json

      - name: Harvest + ingest (with retries)
        env:
          # 2-day window: a skipped trigger must not lose mail. Upserts on
          # gmail_id / ext_id make the overlap free.
          DAYS: "2"
          MAX_ATTEMPTS: "3"
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 0 = enrich every BBS candidate (missing earnings or thin blurb).
          BBS_ENRICH_LIMIT: "0"
          MAILMAN_ONLY: ${{ github.event.inputs.mailman_only == 'true' }}
        run: |
          chmod +x run_daily_harvest.sh
          ./run_daily_harvest.sh

      - name: Mail listing summary (Harve shelf)
        if: always() && hashFiles('pipeline/nm_deals.db') != ''
        env:
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
        run: |
          python - <<'PY'
          import os, sqlite3
          db = os.environ["NM_LOCAL_DB"]
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          try:
              rows = con.execute(
                  "SELECT label, COUNT(*) AS n FROM mail GROUP BY label ORDER BY n DESC"
              ).fetchall()
              listing = con.execute(
                  "SELECT COUNT(*) AS n FROM mail WHERE label = 'listing'"
              ).fetchone()["n"]
          except sqlite3.OperationalError as exc:
              print(f"mail table not ready: {exc}")
              raise SystemExit(0)
          print(f"harve_shelf db={db}")
          print(f"label=listing rows={listing}  (Harve starts here; he does not open Gmail)")
          for r in rows:
              print(f"  label:{r['label']} {r['n']}")
          con.close()
          PY

      # Separate step so a missing/malformed secret fails the job visibly.
      # POST /api/import only — never /api/next/import.
      - name: Push snapshot to Flow App
        if: github.event.inputs.mailman_only != 'true'
        env:
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
          FLOW_APP_URL: ${{ secrets.FLOW_APP_URL }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          FLOW_IMPORT_TOKEN: ${{ secrets.FLOW_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$FLOW_APP_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "${PIPELINE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TOKEN_SRC="PIPELINE_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$(printf '%s' "${FLOW_IMPORT_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            TOKEN_SRC="FLOW_IMPORT_TOKEN"
          fi

          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::FLOW_APP_URL plus PIPELINE_TOKEN (preferred) or FLOW_IMPORT_TOKEN must be set as repo Actions secrets."
            exit 1
          fi

          case "$URL" in
            https://*) ;;
            *)
              echo "::error::FLOW_APP_URL must start with https://"
              echo "Correct value (copy exactly, no quotes): https://web-tau-seven-77.vercel.app"
              echo "Got length ${#URL}, first chars: ${URL:0:16}"
              echo "Do not put the import token in FLOW_APP_URL."
              exit 1
              ;;
          esac

          echo "Pushing to ${URL}/api/import via ${TOKEN_SRC} (token length ${#TOKEN})"
          python export_snapshot.py --db "$NM_LOCAL_DB" --post "$URL" --token "$TOKEN"

      - name: Pursuit CRM (NDA links + CIM attach)
        if: github.event.inputs.mailman_only != 'true'
        env:
          DAYS: "2"
          FLOW_APP_URL: ${{ secrets.FLOW_APP_URL }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          FLOW_IMPORT_TOKEN: ${{ secrets.FLOW_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$FLOW_APP_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "${PIPELINE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            TOKEN="$(printf '%s' "${FLOW_IMPORT_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          python crm_pursuit.py --days "$DAYS" --post "$URL" --token "$TOKEN"

      # Harve's 5:30 shelf. Upload even when mailman_only or when Flow POST fails.
      - name: Upload SQLite db
        if: always() && hashFiles('pipeline/nm_deals.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nm-deals-db-v2
          path: pipeline/nm_deals.db
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload daily CSV snapshot
        if: github.event.inputs.mailman_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deals-csv
          path: pipeline/nails-mercy-deals-*.csv
          if-no-files-found: warn
          retention-days: 90
