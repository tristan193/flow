# Daily deal harvest from dirk@ — LIVE pipeline (cloud, not Tristan's PC).
#
# Flow: Gmail (dirk@) → ingest → nm_deals.db artifact → POST Flow App /api/import
# Google Drive is not part of this path.
#
# Schedule: driven by Vercel Cron hitting the Flow App route
# web/app/api/cron/harvest, which calls workflow_dispatch. GitHub's own
# scheduler never fired for this repo, so the native crons below are only a
# best-effort backup (odd minutes, since :00/:30 are the worst slots).
# See pipeline/GMAIL_SETUP.md §3.
#
# Ingest is idempotent (3-day lookback + ext_id upsert), so overlapping
# triggers are harmless; concurrency below serializes them.
#
# Secrets required:
#   GMAIL_CLIENT_SECRET_JSON, GMAIL_TOKEN_JSON
#   FLOW_APP_URL (e.g. https://web-tau-seven-77.vercel.app)
#   FLOW_IMPORT_TOKEN (same value as Vercel env FLOW_IMPORT_TOKEN)
#
# Retries: run_daily_harvest.sh tries 3x with backoff.
# Re-run failed workflow: Actions → Daily harvest → Re-run jobs.

name: Daily harvest

on:
  # PRIMARY trigger is workflow_dispatch, called by Vercel Cron
  # (web/app/api/cron/harvest). GitHub's own scheduler never fired for this
  # repo, so the crons below are an unreliable backup, nothing more.
  workflow_dispatch:
  repository_dispatch:
    types: [harvest]
  schedule:
    # Odd minutes on purpose — :00/:30 are where GitHub drops schedules.
    - cron: "17 11 * * *" # ~6:17 AM CT (CDT)
    - cron: "23 13 * * *" # ~8:23 AM CT (CDT)
    - cron: "41 15 * * *" # ~10:41 AM CT (CDT)

concurrency:
  group: daily-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore previous SQLite db
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-harvest.yml
          # v2: fresh start after 2026-07-31 flush (old artifact had split SMB cards)
          name: nm-deals-db-v2
          path: pipeline
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Write Gmail OAuth credentials
        env:
          CLIENT: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "Missing GMAIL_CLIENT_SECRET_JSON or GMAIL_TOKEN_JSON secrets"
            exit 1
          fi
          printf '%s' "$CLIENT" > credentials/client_secret.json
          printf '%s' "$TOKEN" > credentials/token.json

      - name: Harvest + ingest (with retries)
        env:
          # 3-day window: a skipped trigger must not lose mail. Upserts on
          # ext_id make the overlap free.
          DAYS: "3"
          MAX_ATTEMPTS: "3"
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
        run: |
          chmod +x run_daily_harvest.sh
          ./run_daily_harvest.sh

      # Separate step so a missing/malformed secret fails the job visibly.
      - name: Push snapshot to Flow App
        env:
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
          FLOW_APP_URL: ${{ secrets.FLOW_APP_URL }}
          FLOW_IMPORT_TOKEN: ${{ secrets.FLOW_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$FLOW_APP_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "$FLOW_IMPORT_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::FLOW_APP_URL and FLOW_IMPORT_TOKEN must be set as repo Actions secrets."
            exit 1
          fi

          case "$URL" in
            https://*) ;;
            *)
              echo "::error::FLOW_APP_URL must start with https://"
              echo "Correct value (copy exactly, no quotes): https://web-tau-seven-77.vercel.app"
              echo "Got length ${#URL}, first chars: ${URL:0:16}"
              echo "Do not put the import token in FLOW_APP_URL."
              exit 1
              ;;
          esac

          echo "Pushing to ${URL}/api/import (token length ${#TOKEN})"
          python export_snapshot.py --db "$NM_LOCAL_DB" --post "$URL" --token "$TOKEN"

      - name: Upload SQLite db
        uses: actions/upload-artifact@v4
        with:
          name: nm-deals-db-v2
          path: pipeline/nm_deals.db
          if-no-files-found: error
          retention-days: 90

      - name: Upload daily CSV snapshot
        uses: actions/upload-artifact@v4
        with:
          name: deals-csv
          path: pipeline/nails-mercy-deals-*.csv
          if-no-files-found: warn
          retention-days: 90
