# Daily deal harvest from dirk@ — LIVE pipeline (cloud, not Tristan's PC).
#
# Flow: Gmail (dirk@) → ingest → nm_deals.db artifact → POST Flow App /api/import
# Google Drive is not part of this path.
#
# Schedule: 11:00 UTC ≈ 6:00 AM Central (CST); during CDT this is 5:00 AM —
# close enough; adjust cron if you want strict CT year-round.
#
# Secrets required:
#   GMAIL_CLIENT_SECRET_JSON, GMAIL_TOKEN_JSON
#   FLOW_APP_URL (e.g. https://web-tau-seven-77.vercel.app)
#   FLOW_IMPORT_TOKEN (same value as Vercel env FLOW_IMPORT_TOKEN)
#
# Retries: run_daily_harvest.sh tries 3x with backoff.
# Re-run failed workflow: Actions → Daily harvest → Re-run jobs.

name: Daily harvest

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: daily-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore previous SQLite db
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-harvest.yml
          name: nm-deals-db
          path: pipeline
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Write Gmail OAuth credentials
        env:
          CLIENT: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "Missing GMAIL_CLIENT_SECRET_JSON or GMAIL_TOKEN_JSON secrets"
            exit 1
          fi
          printf '%s' "$CLIENT" > credentials/client_secret.json
          printf '%s' "$TOKEN" > credentials/token.json

      - name: Harvest + ingest + push to Flow App (with retries)
        env:
          DAYS: "2"
          MAX_ATTEMPTS: "3"
          NM_LOCAL_DB: ${{ github.workspace }}/pipeline/nm_deals.db
          FLOW_APP_URL: ${{ secrets.FLOW_APP_URL }}
          FLOW_IMPORT_TOKEN: ${{ secrets.FLOW_IMPORT_TOKEN }}
        run: |
          chmod +x run_daily_harvest.sh
          ./run_daily_harvest.sh

      - name: Upload SQLite db
        uses: actions/upload-artifact@v4
        with:
          name: nm-deals-db
          path: pipeline/nm_deals.db
          if-no-files-found: error
          retention-days: 90

      - name: Upload daily CSV snapshot
        uses: actions/upload-artifact@v4
        with:
          name: deals-csv
          path: pipeline/nails-mercy-deals-*.csv
          if-no-files-found: warn
          retention-days: 90
