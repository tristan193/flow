---
# ============================================================
#  NAILS & MERCY — BUY BOX CONFIG  v1.0  · DRAFT / INFERRED
#  Single source of truth for filtering + scoring.
#  Edit this file; the pipeline reads it every run.
#  learned.penalties / boosts stay empty until Tristan writes them.
#  Do not invent dislikes or hard-nos.
# ============================================================

meta:
  version: "1.0"
  updated: "2026-07-30"
  members: [tristan, partner]

# ------------------------------------------------------------
# 1. BUSINESS MODEL TYPE
#    Determines which geography rules apply. The classifier
#    assigns exactly one of these to every deal.
# ------------------------------------------------------------
business_model_types:
  LOCAL_SERVICE:
    description: >
      Revenue is bound to a physical service radius. Customers must be
      near the crew. "Men in a truck." Cannot be operated from afar.
    signals:
      - home services, HVAC, plumbing, electrical, roofing, landscaping
      - commercial services, janitorial, facilities, pest, security
      - specialty trades, install/repair, route-based service
      - medical/dental practices, clinics, local care delivery
    geo_rule: must_be_in_TOLA

  LOCATION_AGNOSTIC:
    description: >
      Customers are national/dispersed. Product ships, or service is
      delivered remotely/contractually. Plant location is incidental.
    signals:
      - manufacturing, fabrication, assembly
      - distribution, wholesale, B2B product supply
      - national contract service, licensing, IP-based
      - equipment/consumable supply to institutional buyers
    geo_rule: anywhere_in_US

  AMBIGUOUS:
    description: Classifier not confident. Route to human triage, do not auto-reject.
    geo_rule: manual_review

